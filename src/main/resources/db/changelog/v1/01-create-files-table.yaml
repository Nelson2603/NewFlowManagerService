databaseChangeLog:
  - changeSet:
      id: 1
      author: your_name
      comment: "Создание таблицы files"
      changes:
        - createTable:
            tableName: files
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: file_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: original_file_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: minio_path
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: file_size
                  type: BIGINT
              - column:
                  name: content_type
                  type: VARCHAR(100)
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: converted_minio_path
                  type: VARCHAR(255)
              - column:
                  name: error_message
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP